<define-element>
  <sankirtan-metrics-tab active:boolean="false" books:array groups:array cantop:boolean="false" topbooks:array topperiod:string="all" toploading:boolean="false" toperror:string="" loading:boolean="false" error:string="">
    <style>
      :host { display: contents; }
      .lang-row {
        display: grid;
        grid-template-columns: var(--name-w, 8rem) 1fr 14rem;
        align-items: center;
        gap: var(--s-md);
        padding: var(--s-sm) 0;
      }
      .lang-name { font-weight: var(--f-wt-b); }
      .lang-bar-track {
        height: 0.6rem;
        background: var(--c-border);
        border-radius: 999px;
        overflow: hidden;
      }
      .lang-bar {
        height: 100%;
        background: var(--c-ok);
        border-radius: 999px;
      }
      .lang-stats { font-size: var(--f-sm); text-align: right; white-space: nowrap; }
      .lang-pct { font-weight: var(--f-wt-b); }
    </style>
    <template>
      <section :if="active">

        <div :if="error" class="login-error" :text="error"></div>

        <!-- Teams: every group and lone distributor, all time and this month; totals match the header -->
        <div :if="(groups || []).length" class="card table-wrap" style="margin-bottom:var(--s-md)">
          <div class="card-header"><h3 style="margin:0; font-size:var(--f-lg)">Teams</h3></div>
          <table>
            <thead>
              <tr>
                <th>Team</th>
                <th style="text-align:right">Books</th>
                <th style="text-align:right">Collected</th>
                <th style="text-align:right" title="Temple cost ÷ donation — lower means more goes to the temple">BBT %</th>
              </tr>
            </thead>
            <tbody>
              <tr :each="g in groups">
                <td style="font-weight:var(--f-wt-b)" :text="g.name"></td>
                <td style="text-align:right">
                  <div :text="g.books.toLocaleString()"></div>
                  <div class="dim" style="font-size:var(--f-sm)" :text="g.month_books ? g.month_books.toLocaleString() + ' this month' : 'none this month'"></div>
                </td>
                <td style="text-align:right">
                  <div class="stat-ok" :text="'$' + fmtAmt(g.cents)"></div>
                  <div class="dim" style="font-size:var(--f-sm)" :text="g.month_cents ? '$' + fmtAmt(g.month_cents) + ' this month' : 'none this month'"></div>
                </td>
                <td style="text-align:right">
                  <div :class="pct(g.cost_cents, g.cents) != null && pct(g.cost_cents, g.cents) <= 50 ? 'stat-ok' : ''" :text="fmtPct(pct(g.cost_cents, g.cents))"></div>
                  <div class="dim" style="font-size:var(--f-sm); font-weight:normal" :text="pct(g.month_cost_cents, g.month_cents) == null ? 'none this month' : fmtPct(pct(g.month_cost_cents, g.month_cents)) + ' this month'"></div>
                </td>
              </tr>
            </tbody>
            <tfoot :scope="{t: teamTotal()}">
              <tr style="font-weight:var(--f-wt-b)">
                <td>Total</td>
                <td style="text-align:right">
                  <div :text="t.books.toLocaleString()"></div>
                  <div class="dim" style="font-size:var(--f-sm); font-weight:normal" :text="t.month_books.toLocaleString() + ' this month'"></div>
                </td>
                <td style="text-align:right">
                  <div class="stat-ok" :text="'$' + fmtAmt(t.cents)"></div>
                  <div class="dim" style="font-size:var(--f-sm); font-weight:normal" :text="'$' + fmtAmt(t.month_cents) + ' this month'"></div>
                </td>
                <td style="text-align:right">
                  <div :class="pct(t.cost_cents, t.cents) != null && pct(t.cost_cents, t.cents) <= 50 ? 'stat-ok' : ''" :text="fmtPct(pct(t.cost_cents, t.cents))"></div>
                  <div class="dim" style="font-size:var(--f-sm); font-weight:normal" :text="pct(t.month_cost_cents, t.month_cents) == null ? 'none this month' : fmtPct(pct(t.month_cost_cents, t.month_cents)) + ' this month'"></div>
                </td>
              </tr>
            </tfoot>
          </table>
        </div>

        <!-- Most distributed titles, to guide the next order -->
        <div :if="cantop" class="card" style="padding:var(--s-md) var(--s-lg); margin-bottom:var(--s-md); --name-w:22rem" :scope="{top: topRows()}">
          <div style="display:flex; flex-wrap:wrap; align-items:center; gap:var(--s-sm) var(--s-md); margin-bottom:var(--s-sm)">
            <h3 style="margin:0; font-size:var(--f-lg)">Most distributed books</h3>
            <span :if="top.rows.length" class="dim" style="font-size:var(--f-sm)"
              :text="top.total.toLocaleString() + ' books · ' + top.rows.length + (top.rows.length === 1 ? ' title' : ' titles')"></span>
            <div class="pill-tabs" style="margin-left:auto" role="tablist">
              <button type="button" class="pill-tab" role="tab" :class="{'pill-tab-active': topperiod === '90d'}" :onclick="emit('topperiod', '90d')">Last 90 days</button>
              <button type="button" class="pill-tab" role="tab" :class="{'pill-tab-active': topperiod === 'year'}" :onclick="emit('topperiod', 'year')">This Year</button>
              <button type="button" class="pill-tab" role="tab" :class="{'pill-tab-active': topperiod === 'all'}" :onclick="emit('topperiod', 'all')">All Time</button>
            </div>
          </div>
          <div :if="(topbooks || []).length" style="display:flex; flex-wrap:wrap; gap:var(--s-sm); margin-bottom:var(--s-sm)">
            <select aria-label="Language" style="width:auto; font-size:var(--f-sm)" :onchange="e => topLang = e.target.value">
              <option value="" :selected="!topLang">All languages</option>
              <option :each="l in topOptions('language')" :value="l" :text="l" :selected="l === topLang"></option>
            </select>
            <select aria-label="Cover type" style="width:auto; font-size:var(--f-sm)" :onchange="e => topCover = e.target.value">
              <option value="" :selected="!topCover">All cover types</option>
              <option :each="c in topOptions('cover')" :value="c" :text="c" :selected="c === topCover"></option>
            </select>
          </div>
          <div :if="toperror" class="login-error" :text="toperror"></div>
          <div :if="toploading" class="dim" style="padding:var(--s-md) 0">Loading…</div>
          <div :if="!toploading && !toperror && !top.rows.length" class="dim" style="padding:var(--s-md) 0"
            :text="topLang || topCover ? 'No books match these filters.' : 'No books distributed in this period.'"></div>
          <div :each="(r, i) in top.rows" class="lang-row">
            <span style="display:flex; gap:var(--s-sm); min-width:0">
              <span class="dim" style="flex-shrink:0; min-width:1.5rem" :text="i + 1"></span>
              <span style="min-width:0">
                <span class="lang-name" style="display:block" :text="r.title"></span>
                <span class="dim" style="display:block; font-size:var(--f-sm)" :text="[r.language, r.cover].filter(Boolean).join(' · ')"></span>
              </span>
            </span>
            <div class="lang-bar-track"><div class="lang-bar" :style="{width: r.pct + '%'}"></div></div>
            <span class="lang-stats">
              <span class="lang-pct" :text="r.qty.toLocaleString() + ' distributed'"></span>
              <span class="dim" :text="r.stock == null ? '' : ' · ' + r.stock.toLocaleString() + ' in stock'"></span>
            </span>
          </div>
        </div>

        <div :if="loading && !books.length" class="dim" style="padding:var(--s-lg); text-align:center">Loading…</div>
        <div :if="!loading && !books.length && !error" class="dim" style="padding:var(--s-lg); text-align:center">No books in catalog yet.</div>

        <div :if="books.length" style="display:flex; flex-direction:column; gap:var(--s-md)">
          <div :each="sec in SECTIONS" class="card" style="padding:var(--s-md) var(--s-lg)"
            :style="{'--name-w': sec.nameWidth}" :scope="{bd: breakdown(sec.field)}">
            <div style="display:flex; flex-wrap:wrap; align-items:baseline; gap:var(--s-sm) var(--s-md); margin-bottom:var(--s-sm)">
              <h3 style="margin:0; font-size:var(--f-lg)" :text="sec.title"></h3>
              <span class="dim" style="font-size:var(--f-sm)"
                :text="bd.totalUnits + ' units · ' + bd.totalTitles + ' titles'"></span>
            </div>
            <div :if="!bd.totalUnits" class="dim" style="padding:var(--s-md) 0">No stock on hand.</div>
            <div :each="r in bd.rows" class="lang-row">
              <span class="lang-name" :text="r.label"></span>
              <div class="lang-bar-track"><div class="lang-bar" :style="{width: r.pct + '%'}"></div></div>
              <span class="lang-stats">
                <span class="lang-pct" :text="r.pct + '%'"></span>
                <span class="dim" :text="' · ' + r.units + ' units · ' + r.titles + ' title' + (r.titles === 1 ? '' : 's')"></span>
              </span>
            </div>
          </div>
        </div>

      </section>
    </template>
    <script>
      // Filters for the ranking; labels match the catalog and sessions tabs.
      this.topLang = ''
      this.topCover = ''
      this.coverLabel = function(cat) {
        if (cat === 'STK') return 'Stack'
        return ({ H:'Hard cover', A:'Audiobook', E:'Audiobook + Ebook' })[cat && cat[0]] || 'Soft cover'
      }
      this.topOptions = function(kind) {
        var self = this, seen = {}
        ;(this.topbooks || []).forEach(function(r) {
          var v = kind === 'cover' ? self.coverLabel(r.category) : r.language
          if (v) seen[v] = true
        })
        return Object.keys(seen).sort()
      }
      // Ranked titles with a bar relative to the top one, plus stock on hand from the catalog.
      this.topRows = function() {
        var stock = {}
        ;(this.books || []).forEach(function(b) { stock[b.id] = b.stock })
        var self = this, lang = this.topLang, cover = this.topCover
        var list = (this.topbooks || []).filter(function(r) {
          return (!lang || r.language === lang) && (!cover || self.coverLabel(r.category) === cover)
        })
        var max = list.length ? list[0].qty : 0, total = 0
        var rows = list.map(function(r) {
          total += r.qty
          return { title: r.title, language: r.language, cover: self.coverLabel(r.category), qty: r.qty, pct: max ? Math.round(r.qty / max * 100) : 0, stock: stock[r.book_id] }
        })
        return { rows: rows, total: total }
      }
      // BBT % = temple cost ÷ donation; null when nothing was collected.
      this.pct = function(cost, collected) { return collected > 0 ? cost / collected * 100 : null }
      this.fmtPct = function(p) { return p == null ? '—' : Math.round(p) + '%' }
      this.teamTotal = function() {
        var t = { books: 0, cents: 0, cost_cents: 0, month_books: 0, month_cents: 0, month_cost_cents: 0 }
        ;(this.groups || []).forEach(function(g) {
          t.books += g.books; t.cents += g.cents; t.cost_cents += g.cost_cents
          t.month_books += g.month_books; t.month_cents += g.month_cents; t.month_cost_cents += g.month_cost_cents
        })
        return t
      }
      this.SECTIONS = [
        { title: 'Inventory by language', field: 'language', nameWidth: '8rem' },
        { title: 'Inventory by author', field: 'author', nameWidth: '18rem' },
      ]
      // Stock-weighted share grouped by a book field. Stacks are excluded: their
      // availability derives from component-book stock, so counting them would
      // double-count units.
      this.breakdown = function(field) {
        var groups = {}
        var totalUnits = 0, totalTitles = 0
        ;(this.books || []).forEach(function(b) {
          if (b.is_stack || b.active === false) return
          var key = b[field] || 'Unspecified'
          var g = groups[key] || (groups[key] = { label: key, units: 0, titles: 0 })
          g.units += b.stock || 0
          g.titles += 1
          totalUnits += b.stock || 0
          totalTitles += 1
        })
        var rows = Object.values(groups)
          .sort(function(a, b) { return b.units - a.units })
          .map(function(g) {
            g.pct = totalUnits ? Math.round(g.units / totalUnits * 1000) / 10 : 0
            return g
          })
        return { rows: rows, totalUnits: totalUnits, totalTitles: totalTitles }
      }
    </script>
  </sankirtan-metrics-tab>
</define-element>
