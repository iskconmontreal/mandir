<define-element>
  <sankirtan-leaderboard-tab active:boolean="false" results:array period:string="month" loading:boolean="false" error:string="" monthlabel:string="" monthoffset:number="0">
    <style>:host { display: contents; }</style>
    <template>
      <section :if="active">

        <!-- Period selector — the month pill steps back through past months -->
        <div class="pill-tabs" style="margin-bottom:var(--s-lg)" role="tablist">
          <span class="pill-tab pill-month" :class="{'pill-tab-active': period === 'month'}">
            <button type="button" class="pill-step" aria-label="Previous month"
              :onclick="emit('monthstep', 1)" :html="icon('chevron_left')"></button>
            <button type="button" class="pill-month-label" role="tab"
              :onclick="emit('periodchange', 'month')" :text="monthlabel"></button>
            <button type="button" class="pill-step" aria-label="Next month"
              :class="{dim: monthoffset === 0}"
              :onclick="emit('monthstep', -1)" :html="icon('chevron_right')"></button>
          </span>
          <button type="button" class="pill-tab" role="tab"
            :class="{'pill-tab-active': period === 'year'}"
            :onclick="emit('periodchange', 'year')">This Year</button>
          <button type="button" class="pill-tab" role="tab"
            :class="{'pill-tab-active': period === 'all'}"
            :onclick="emit('periodchange', 'all')">All Time</button>
        </div>

        <div :if="hasGroups()" class="pill-tabs" style="margin-left:var(--s-md); margin-bottom:var(--s-lg)" role="tablist">
          <button type="button" class="pill-tab" role="tab"
            :class="{'pill-tab-active': view === 'individual'}"
            :onclick="setView('individual')">Devotees</button>
          <button type="button" class="pill-tab" role="tab"
            :class="{'pill-tab-active': view === 'group'}"
            :onclick="setView('group')">Groups</button>
        </div>

        <div :if="error" class="login-error" :text="error"></div>
        <div :if="loading" class="dim" style="padding:var(--s-lg); text-align:center">Loading…</div>
        <div :if="!loading && !results.length && !error" class="dim" style="padding:var(--s-lg); text-align:center">No data for this period.</div>

        <div :if="!loading && results.length" class="card table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:3rem">#</th>
                <th class="th-sort" :class="sortCls('distributor_name')" :onclick="sort('distributor_name')">Distributor</th>
                <th class="th-sort" style="text-align:right" :class="sortCls('points')" :onclick="sort('points')">Points</th>
                <th class="th-sort" style="text-align:right" :class="sortCls('books')" :onclick="sort('books')">Books</th>
                <th class="th-sort" style="text-align:right" :class="sortCls('collected_cents')" :onclick="sort('collected_cents')">Collected</th>
                <th class="th-sort" style="text-align:right" :class="sortCls('bbt_pct')" :onclick="sort('bbt_pct')" title="Temple cost ÷ donation — lower means more goes to the temple">BBT %</th>
              </tr>
            </thead>
            <tbody :each="(row, i) in sortedResults()">
              <tr :style="{cursor: row.is_group ? 'pointer' : ''}"
                :onclick.stop="row.is_group && toggleGroup(row)">
                <td class="dim" :text="i + 1"></td>
                <td style="font-weight:var(--f-wt-b)">
                  <span :if="row.is_group" :html="icon('chevron_right')"
                    style="display:inline-flex; vertical-align:middle; margin-right:var(--s-xs); transition:transform .15s"
                    :style="{transform: groupOpen[row.distributor_name] ? 'rotate(90deg)' : 'none'}"></span>
                  <span :text="row.distributor_name"></span>
                  <span :if="row.is_group" class="dim" :text="' · ' + row.members.length + ' devotees'"></span>
                </td>
                <td style="text-align:right"
                  :class="(sortBy === 'points' && i === 0) ? 'stat-ok' : ''"
                  :text="row.points"></td>
                <td style="text-align:right" :text="row.books"></td>
                <td style="text-align:right" :text="'$' + fmtAmt(row.collected_cents)"></td>
                <td style="text-align:right"
                  :class="row.bbt_pct != null && row.bbt_pct <= 50 ? 'stat-ok' : ''"
                  :text="row.bbt_pct == null ? '—' : Math.round(row.bbt_pct) + '%'"></td>
              </tr>
              <tr :if="row.is_group && groupOpen[row.distributor_name]">
                <td colspan="6" style="padding-left:var(--s-xl)">
                  <div :each="m in sortedMembers(row)"
                    style="display:flex; align-items:center; gap:var(--s-sm); padding:var(--s-xs) 0; font-size:var(--f-sm)">
                    <span style="flex:1" :text="m.distributor_name"></span>
                    <span :text="m.points + ' pts'"></span>
                    <span class="dim" :text="m.books + ' books'"></span>
                    <span class="dim" :text="'$' + fmtAmt(m.collected_cents)"></span>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </section>
    </template>
    <script>
      // fmtAmt injected via setupProcessor
      this.sortBy = 'points'      // default matches the server's points-DESC order
      this.sortDir = 'desc'
      // Intuitive first-click direction: names A→Z; "more is better" metrics high→low;
      // BBT % low→high (lower = more to the temple).
      this.defaultDir = function(col) { return col === 'distributor_name' || col === 'bbt_pct' ? 'asc' : 'desc' }
      this.sort = function(col) {
        if (this.sortBy === col) this.sortDir = this.sortDir === 'asc' ? 'desc' : 'asc'
        else { this.sortBy = col; this.sortDir = this.defaultDir(col) }
      }
      this.sortCls = function(col) { return this.sortBy === col ? (this.sortDir === 'asc' ? 'th-sort-asc' : 'th-sort-desc') : '' }
      this.sortRows = function(rows) {
        var col = this.sortBy, dir = this.sortDir === 'asc' ? 1 : -1
        return [...rows].sort(function(a, b) {
          var av = a[col], bv = b[col]
          if (av == null && bv == null) return 0
          if (av == null) return 1          // nulls (e.g. bbt_pct "—") always last, both directions
          if (bv == null) return -1
          if (typeof av === 'string' || typeof bv === 'string') return String(av).localeCompare(String(bv)) * dir
          return (av - bv) * dir
        })
      }

      // Devotees sharing a meta.group arrive merged into one row carrying its members.
      this.view = 'individual'
      this.groupOpen = {}
      this.hasGroups = function() { return (this.results || []).some(function(r) { return r.is_group }) }
      this.setView = function(v) { this.view = v; this.groupOpen = {} }
      // Replaced rather than mutated — sprae doesn't track an in-place edit here.
      this.toggleGroup = function(row) {
        this.groupOpen = Object.assign({}, this.groupOpen, { [row.distributor_name]: !this.groupOpen[row.distributor_name] })
      }
      this.sortedResults = function() {
        var rows = this.results || []
        if (this.view === 'individual') rows = rows.flatMap(function(r) { return r.is_group && r.members?.length ? r.members : [r] })
        return this.sortRows(rows)
      }
      this.sortedMembers = function(row) { return this.sortRows(row.members || []) }
    </script>
  </sankirtan-leaderboard-tab>
</define-element>
